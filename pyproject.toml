[project]
name = "agriassist"
version = "2.0.0"
description = "Agricultural Assistant Platform - Full-stack AI-driven agricultural ecosystem"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "aiosqlite>=0.19.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "argon2-cffi>=23.1.0",
    "python-dotenv>=1.0.0",
    "google-generativeai>=0.8.3",
    "langchain-core>=0.3.39",
    "pillow>=10.0.0",
    "matplotlib>=3.8.0",
    "shapely>=2.0.2",
    "pyproj>=3.6.1",
    "numpy>=1.24.0,<2.0.0",
    "jinja2>=3.1.3",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "email-validator>=2.1.0",
    "neo4j>=5.16.0",
    "twilio>=9.0.0",
    "psycopg2-binary>=2.9.9",
    "supabase>=2.3.7",
    "setuptools>=68.0.0",
    "wheel>=0.42.0",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel>=0.42.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["uploads*", "local_s3*", "scratch*", "tests*"]
